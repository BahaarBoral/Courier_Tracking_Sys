<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LogiTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page" style="align-items: flex-start; padding: 40px 20px;">
    <div class="auth-card" style="max-width: 600px; margin: 0 auto;">
        <div class="auth-header">
            <a href="index.html"><h1><i class="fas fa-truck-fast"></i> LogiTrack</h1></a>
            <p class="text-muted mt-20">Create a customer account to start shipping.</p>
        </div>
        
        <form id="register-form">
            <div class="grid" style="margin-bottom: 0; gap: 15px;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" required placeholder="+1 234 567 8900">
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
            </div>
            
            <div class="form-group">
                <label>Address</label>
                <textarea id="address" rows="3" required placeholder="Full shipping address"></textarea>
            </div>
            
            <div class="grid" style="margin-bottom: 0; gap: 15px;">
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" required placeholder="Min 6 characters">
                        <i class="fas fa-eye password-toggle" id="toggle-password"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirm-password" required placeholder="Confirm password">
                        <i class="fas fa-eye password-toggle" id="toggle-confirm-password"></i>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn btn-success btn-block mt-20" id="register-btn">Create Account</button>
        </form>
        
        <div class="auth-footer">
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
